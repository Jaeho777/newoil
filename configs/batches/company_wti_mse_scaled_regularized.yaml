name: "company_wti_mse_scaled_regularized"
description: "Reference-notebook-inspired daily and weekly uni vs multi comparison with MSE loss, robust scaling, longer validation, and less aggressive early stopping."
start_date: "2011-01-01"
feature_manifest_path: "configs/manifests/wti_feature_sets.yaml"

runtime:
  random_seed: 1

models:
  - "GRU"
  - "TimeXer"
  - "iTransformer"

dataset_refs:
  daily: "configs/papers_raw.yaml"
  weekly: "configs/papers_weekly.yaml"

training_defaults:
  input_size: 52
  batch_size: 32
  valid_batch_size: 32
  windows_batch_size: 128
  inference_windows_batch_size: 1024
  max_steps: 200
  scaler_type: "robust"
  val_check_steps: 1
  early_stop_patience_steps: 30
  model_step_size: 1
  loss: "mse"
  learning_rate: 0.0002
  optimizer:
    name: "adamw"
    kwargs:
      weight_decay: 1.0e-04
  lr_scheduler:
    name: "ReduceLROnPlateau"
    mode: "min"
    factor: 0.5
    patience: 8
    threshold: 0.001
    threshold_mode: "rel"
    cooldown: 0
    min_lr: 0.0
    eps: 1.0e-06
  trainer_kwargs:
    enable_checkpointing: false
    max_epochs: 200

model_training_overrides:
  GRU:
    model_kwargs:
      encoder_hidden_size: 48
      decoder_hidden_size: 48
      encoder_dropout: 0.25
  TimeXer:
    learning_rate: 0.0003
    model_kwargs:
      hidden_size: 128
      n_heads: 4
      d_ff: 512
      dropout: 0.15
  iTransformer:
    learning_rate: 0.0003
    model_kwargs:
      hidden_size: 128
      n_heads: 4
      d_ff: 256
      dropout: 0.2

report:
  loss_scale: "linear"
  x_axis: "epoch"

scenarios:
  - name: "uni_daily_h12_scaled_regularized"
    dataset: "daily"
    mode: "univariate"
    horizon: 12
    val_size: 60
    test_size: 12
    report:
      lookback_plot: 120

  - name: "multi_daily_h12_scaled_regularized"
    dataset: "daily"
    mode: "multivariate"
    horizon: 12
    val_size: 60
    test_size: 12
    report:
      lookback_plot: 120

  - name: "uni_weekly_h2_scaled_regularized"
    dataset: "weekly"
    mode: "univariate"
    horizon: 2
    val_size: 52
    test_size: 2
    report:
      lookback_plot: 60

  - name: "multi_weekly_h2_scaled_regularized"
    dataset: "weekly"
    mode: "multivariate"
    horizon: 2
    val_size: 52
    test_size: 2
    report:
      lookback_plot: 60
